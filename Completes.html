
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Encadrements – Étudiants</title>

  <style>
    :root{
      --border:#ddd;
      --muted:#666;
      --bg:#fff;
      --bg2:#fafafa;
      --head:#f3f3f3;
      --link:#0645ad;
    }
    body{
      margin:0;
      padding:16px;
      font-family: Arial, Helvetica, sans-serif;
      color:#222;
      background:var(--bg);
    }
    header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-bottom:12px;
    }
    h1{
      font-size:18px;
      margin:0;
      font-weight:700;
    }
    .subtitle{
      margin-top:4px;
      color:var(--muted);
      font-size:13px;
    }

    /* Barre d’outils */
    .toolbar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      margin:12px 0 14px 0;
      padding:10px;
      background:var(--bg2);
      border:1px solid var(--border);
      border-radius:10px;
    }
    .toolbar label{
      font-size:13px;
      color:#333;
    }
    .toolbar input[type="search"],
    .toolbar select{
      font-size:14px;
      padding:8px 10px;
      border:1px solid var(--border);
      border-radius:8px;
      background:#fff;
      min-width:180px;
    }
    .toolbar .small{
      min-width:140px;
    }
    .toolbar .right{
      margin-left:auto;
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .btn{
      font-size:13px;
      padding:8px 10px;
      border:1px solid var(--border);
      border-radius:8px;
      background:#fff;
      cursor:pointer;
    }
    .btn:hover{ background:#f7f7f7; }
    .pill{
      font-size:12px;
      color:var(--muted);
      padding:6px 10px;
      border:1px solid var(--border);
      border-radius:999px;
      background:#fff;
    }

    /* Accordéons par année */
    .year-group{
      border:1px solid var(--border);
      border-radius:12px;
      margin:10px 0;
      overflow:hidden;
      background:#fff;
    }
    .year-header{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      padding:10px 12px;
      background:var(--head);
      cursor:pointer;
      user-select:none;
    }
    .year-header strong{ font-size:15px; }
    .year-header span{ color:var(--muted); font-size:12px; }
    .year-content{
      padding:10px 12px 6px 12px;
      display:none;
    }
    .year-group.open .year-content{ display:block; }

    /* Cartes d’entrées */
    .entry{
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px 12px;
      margin:8px 0;
      background:#fff;
    }
    .entry-top{
      display:flex;
      gap:10px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .title{
      font-weight:700;
      font-size:14px;
      margin:0 0 4px 0;
    }
    .title a{ color:var(--link); text-decoration:none; }
    .title a:hover{ text-decoration:underline; }

    .meta{
      font-size:13px;
      color:#333;
      margin:0;
    }
    .meta .muted{ color:var(--muted); }
    .tags{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:8px;
    }
    .tag{
      font-size:12px;
      padding:4px 8px;
      border:1px solid var(--border);
      border-radius:999px;
      background:var(--bg2);
      color:#333;
    }

    /* Table fallback (si JS désactivé) */
    .table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
      line-height:1.35;
      min-width:900px;
    }
    th, td{
      border:1px solid var(--border);
      padding:8px 10px;
      vertical-align:top;
    }
    thead th{ background:var(--head); text-align:left; }
    tbody tr:nth-child(even){ background:var(--bg2); }
    td:nth-child(1), td:nth-child(2){ text-align:right; white-space:nowrap; }

    /* Visibilité */
    .hidden{ display:none !important; }

    @media (max-width: 900px){
      body{ padding:10px; }
      .toolbar input[type="search"], .toolbar select{ min-width: 150px; }
    }
  </style>
</head>

  <script>
    // --- Bilingue (libellés UI seulement)
    const I18N = {
      fr: {
        title: "Encadrements de mémoires et thèses",
        subtitle: "Recherche, filtres et regroupement par année.",
        search: "Recherche",
        searchPh: "Nom, titre, programme…",
        year: "Année",
        all: "Toutes",
        program: "Programme",
        all2: "Tous",
        openAll: "Tout ouvrir",
        closeAll: "Tout fermer",
        reset: "Réinitialiser",
        count: (n, total) => `${n} / ${total} entrées`,
        yearCount: (n) => `${n} entrée(s)`,
        student: "Étudiant·e",
        degree: "Programme",
        notes: "Notes"
      },
      en: {
        title: "Supervised theses and dissertations",
        subtitle: "Search, filters, and grouping by year.",
        search: "Search",
        searchPh: "Name, title, program…",
        year: "Year",
        all: "All",
        program: "Degree",
        all2: "All",
        openAll: "Expand all",
        closeAll: "Collapse all",
        reset: "Reset",
        count: (n, total) => `${n} / ${total} entries`,
        yearCount: (n) => `${n} entry(ies)`,
        student: "Student",
        degree: "Degree",
        notes: "Notes"
      }
    };

    let lang = "fr";
    const t = () => I18N[lang];

    // --- Lecture de vos <tr> existants, sans ressaisie
    function parseRows() {
      const tbody = document.getElementById("data-body");
      const rows = Array.from(tbody.querySelectorAll("tr"));
      const items = rows.map((tr) => {
        const tds = Array.from(tr.querySelectorAll("td")).map(td => td.cloneNode(true));
        const getText = (node) => (node.textContent || "").replace(/\s+/g," ").trim();

        const idx = getText(tds[0] || tr);
        const year = getText(tds[1] || tr);

        // Titre : si lien <a>, on le garde
        let titleHTML = "";
        let titleText = "";
        if (tds[2]) {
          const a = tds[2].querySelector("a");
          if (a) {
            const href = a.getAttribute("href") || "";
            titleText = getText(a);
            titleHTML = `<a href="${href}" target="_blank" rel="noopener noreferrer">${escapeHtml(titleText)}</a>`;
          } else {
            titleText = getText(tds[2]);
            titleHTML = escapeHtml(titleText);
          }
        }

        const student = getText(tds[3] || tr);
        const program = getText(tds[4] || tr);
        const notes = getText(tds[5] || tr);

        const haystack = [
          year, titleText, student, program, notes
        ].join(" ").toLowerCase();

        return { idx, year, titleHTML, titleText, student, program, notes, haystack };
      }).filter(x => x.year || x.titleText || x.student || x.program);

      return items;
    }

    function escapeHtml(s){
      return (s || "").replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    // --- UI
    const q = document.getElementById("q");
    const yearSel = document.getElementById("yearSel");
    const progSel = document.getElementById("progSel");
    const app = document.getElementById("app");
    const fallback = document.getElementById("fallback");
    const countPill = document.getElementById("countPill");

    const langBtn = document.getElementById("langBtn");
    const pageTitle = document.getElementById("pageTitle");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const lblSearch = document.getElementById("lblSearch");
    const lblYear = document.getElementById("lblYear");
    const lblProg = document.getElementById("lblProg");
    const expandAll = document.getElementById("expandAll");
    const collapseAll = document.getElementById("collapseAll");
    const resetBtn = document.getElementById("resetBtn");

    let ALL = [];

    function populateFilters(items){
      const years = Array.from(new Set(items.map(x => x.year).filter(Boolean))).sort((a,b)=> Number(b)-Number(a));
      const progs = Array.from(new Set(items.map(x => x.program).filter(Boolean))).sort((a,b)=> a.localeCompare(b));

      // Years
      yearSel.innerHTML = "";
      const optAll = document.createElement("option");
      optAll.value = "";
      optAll.textContent = t().all;
      yearSel.appendChild(optAll);
      years.forEach(y=>{
        const o=document.createElement("option");
        o.value=y;
        o.textContent=y;
        yearSel.appendChild(o);
      });

      // Programs
      progSel.innerHTML = "";
      const optAll2 = document.createElement("option");
      optAll2.value = "";
      optAll2.textContent = t().all2;
      progSel.appendChild(optAll2);
      progs.forEach(p=>{
        const o=document.createElement("option");
        o.value=p;
        o.textContent=p;
        progSel.appendChild(o);
      });
    }

    function applyI18n(){
      pageTitle.textContent = t().title;
      pageSubtitle.textContent = t().subtitle;
      lblSearch.textContent = t().search;
      q.placeholder = t().searchPh;
      lblYear.textContent = t().year;
      lblProg.textContent = t().program;
      expandAll.textContent = t().openAll;
      collapseAll.textContent = t().closeAll;
      resetBtn.textContent = t().reset;
      langBtn.textContent = (lang === "fr") ? "EN" : "FR";

      // Repeupler les filtres (libellés "Toutes/Tous" changent)
      populateFilters(ALL);

      render();
    }

    function currentFiltered(){
      const qq = (q.value || "").trim().toLowerCase();
      const y = yearSel.value || "";
      const p = progSel.value || "";

      return ALL.filter(it=>{
        if (y && it.year !== y) return false;
        if (p && it.program !== p) return false;
        if (qq && !it.haystack.includes(qq)) return false;
        return true;
      });
    }

    function render(){
      const items = currentFiltered();
      countPill.textContent = t().count(items.length, ALL.length);

      // Regroupement par année
      const byYear = new Map();
      items.forEach(it=>{
        const key = it.year || "—";
        if (!byYear.has(key)) byYear.set(key, []);
        byYear.get(key).push(it);
      });

      const years = Array.from(byYear.keys()).sort((a,b)=> Number(b)-Number(a));

      app.innerHTML = years.map(year=>{
        const list = byYear.get(year);
        const cards = list.map(it=>`
          <div class="entry" data-year="${escapeHtml(year)}">
            <div class="entry-top">
              <div>
                <p class="title">${it.titleHTML || escapeHtml(it.titleText || "")}</p>
                <p class="meta"><span class="muted">${t().student}:</span> ${escapeHtml(it.student || "")}</p>
                <p class="meta"><span class="muted">${t().degree}:</span> ${escapeHtml(it.program || "")}</p>
                ${it.notes ? `<p class="meta"><span class="muted">${t().notes}:</span> ${escapeHtml(it.notes)}</p>` : ``}
              </div>
              <div class="tags">
                ${it.idx ? `<span class="tag">#${escapeHtml(it.idx)}</span>` : ``}
              </div>
            </div>
          </div>
        `).join("");

        return `
          <section class="year-group open" data-year="${escapeHtml(year)}">
            <div class="year-header" role="button" tabindex="0" aria-expanded="true">
              <div>
                <strong>${escapeHtml(year)}</strong>
                <span>• ${t().yearCount(list.length)}</span>
              </div>
              <span class="muted">▾</span>
            </div>
            <div class="year-content">
              ${cards}
            </div>
          </section>
        `;
      }).join("");

      // Masquer la table brute si on a rendu l’app
      fallback.classList.add("hidden");

      // Activer accordéons
      document.querySelectorAll(".year-header").forEach(h=>{
        h.addEventListener("click", ()=>toggleYear(h));
        h.addEventListener("keydown", (e)=>{
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleYear(h); }
        });
      });
    }

    function toggleYear(header){
      const group = header.closest(".year-group");
      const isOpen = group.classList.toggle("open");
      header.setAttribute("aria-expanded", isOpen ? "true" : "false");
      const arrow = header.querySelector("span.muted");
      if (arrow) arrow.textContent = isOpen ? "▾" : "▸";
    }

    // Boutons
    expandAll.addEventListener("click", ()=>{
      document.querySelectorAll(".year-group").forEach(g=>{
        g.classList.add("open");
        const h = g.querySelector(".year-header");
        if (h) h.setAttribute("aria-expanded","true");
        const arrow = g.querySelector(".year-header span.muted");
        if (arrow) arrow.textContent = "▾";
      });
    });

    collapseAll.addEventListener("click", ()=>{
      document.querySelectorAll(".year-group").forEach(g=>{
        g.classList.remove("open");
        const h = g.querySelector(".year-header");
        if (h) h.setAttribute("aria-expanded","false");
        const arrow = g.querySelector(".year-header span.muted");
        if (arrow) arrow.textContent = "▸";
      });
    });

    resetBtn.addEventListener("click", ()=>{
      q.value = "";
      yearSel.value = "";
      progSel.value = "";
      render();
    });

    // Filtres
    q.addEventListener("input", render);
    yearSel.addEventListener("change", render);
    progSel.addEventListener("change", render);

    // Langue
    langBtn.addEventListener("click", ()=>{
      lang = (lang === "fr") ? "en" : "fr";
      applyI18n();
    });

    // Boot
    ALL = parseRows();
    populateFilters(ALL);
    applyI18n();
  </script>
