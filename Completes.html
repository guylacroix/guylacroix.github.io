<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Encadrements – Mémoires et thèses</title>

  <!-- ESSENTIEL pour Google Sites / iframe -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* Reset minimal et typographie sobre */
    body{
      margin:0;
      padding:16px;
      font-family: Arial, Helvetica, sans-serif;
      color:#222;
      background:#fff;
    }

    h1{
      font-size:18px;
      margin:0 0 12px 0;
      font-weight:600;
    }

    /* Conteneur scrollable pour écrans étroits / iframe */
    .table-wrap{
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
      line-height:1.35;
      min-width:900px; /* empêche l’écrasement */
    }

    th, td{
      border:1px solid #ddd;
      padding:8px 10px;
      vertical-align:top;
    }

    thead th{
      background:#f3f3f3;
      font-weight:600;
      text-align:left;
      position:sticky;
      top:0;
      z-index:1;
    }

    tbody tr:nth-child(even){
      background:#fafafa;
    }

    /* Colonnes numériques */
    td:nth-child(1),
    td:nth-child(2){
      text-align:right;
      white-space:nowrap;
    }

    /* Liens */
    a{
      color:#0645ad;
      text-decoration:none;
    }
    a:hover{
      text-decoration:underline;
    }

    /* Responsive léger */
    @media (max-width: 900px){
      body{padding:8px}
      h1{font-size:16px}
    }
  </style>
</head>

<body>

<h1>Encadrements de mémoires et thèses</h1>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Année</th>
      <th>Titre</th>
      <th>Étudiant·e</th>
      <th>Programme</th>
      <th>Notes</th>
    </tr>
  </thead>

  <tbody>

    <!-- COLLEZ ICI VOS <tr> ... </tr> SANS LES MODIFIER -->
    <!-- Exemple (le vôtre fonctionne tel quel) -->

    <tr>
      <td>1</td>
      <td>2026</td>
      <td>Effet des volets du Programme Objectif-Emploi sur la sortie de l'aide sociale</td>
      <td>Diabaté, Wambley Karl Ibrahim</td>
      <td>Maîtrise (codirecteur)</td>
      <td></td>
    </tr>

    <!-- … tout votre contenu existant … -->

  </tbody>
</table>
</div>

</body>
</html>
